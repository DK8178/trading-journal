<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Trading Journal">
<title>Trading Journal</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png">
<style>
:root{color-scheme:dark;--bg:#0b0f14;--p:#121820;--p2:#18212b;--b:#293543;--t:#f5f7fa;--m:#91a0b2;--g:#39c879;--r:#ff6464;--a:#4da3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);min-height:100vh}.app{max-width:980px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:42px;height:42px;border-radius:13px;background:#17324d;display:grid;place-items:center;font-weight:900}h1,h2,h3,p{margin-top:0}header h1{font-size:21px;margin:0}header p{font-size:12px;color:var(--m);margin:4px 0 0}.panel{background:var(--p);border:1px solid var(--b);border-radius:18px;padding:14px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:1px solid var(--b);background:var(--p2);color:var(--t);border-radius:12px;padding:10px 13px;font-weight:750}.primary{background:var(--a);border-color:var(--a)}.danger{background:#381d24;border-color:#6d3038}.month{font-weight:900;text-transform:capitalize;text-align:center;flex:1}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:var(--m);font-size:11px;font-weight:800;padding:5px}.day{min-height:76px;border:1px solid var(--b);border-radius:11px;background:#10161d;padding:6px;text-align:left;color:var(--t)}.day.out{opacity:.28}.day.green{background:#103022;border-color:#276a49}.day.red{background:#321a1d;border-color:#7a3439}.day .n{font-weight:850}.day .pnl{font-size:11px;font-weight:900;margin-top:12px;white-space:nowrap;overflow:hidden}.day .cnt{font-size:9px;color:var(--m);margin-top:2px}.pos{color:var(--g)}.neg{color:var(--r)}.trade{padding:13px;border:1px solid var(--b);background:var(--p2);border-radius:14px;margin:8px 0}.trade b{font-size:17px}.meta{font-size:12px;color:var(--m);margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:12px;font-weight:800;margin:0 0 6px}input,select,textarea{width:100%;background:#0f151c;color:var(--t);border:1px solid var(--b);border-radius:12px;padding:12px;font:inherit}textarea{min-height:95px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:var(--p2);border:1px solid var(--b);border-radius:13px;padding:12px}.metric small{color:var(--m);display:block}.metric strong{font-size:19px;display:block;margin-top:5px}.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(420px,calc(100% - 24px));display:grid;grid-template-columns:1fr 72px 1fr;gap:6px;background:#111820eF;border:1px solid var(--b);border-radius:18px;padding:7px;backdrop-filter:blur(16px)}.nav button{border:0;background:transparent;color:var(--m);padding:11px;border-radius:12px;font-weight:800}.nav .plus{background:var(--a);color:white;font-size:27px;margin-top:-24px;height:58px;border-radius:18px}.shot{max-width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:#070a0d}.note{color:var(--m);font-size:12px;line-height:1.45}.hidden{display:none!important}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.day{min-height:70px;padding:5px}.day .pnl{font-size:10px}.day .cnt{font-size:8px}}
</style>
</head>
<body><div class="app"><header><div class="logo">TJ</div><div><h1>Trading Journal</h1><p>Offline · privat · lokal gespeichert</p></div></header><main id="v"></main></div>
<nav class="nav"><button id="home">Kalender</button><button id="add" class="plus">+</button><button id="stats">Statistik</button></nav>
<input id="restoreFile" class="hidden" type="file" accept=".json,application/json">
<script>
const $=s=>document.querySelector(s), V=$('#v'); let trades=[],capital=0,month=new Date(new Date().getFullYear(),new Date().getMonth(),1),selected=null;
const dbp=new Promise((ok,no)=>{const q=indexedDB.open('tj-db',1);q.onupgradeneeded=()=>{let d=q.result;if(!d.objectStoreNames.contains('trades'))d.createObjectStore('trades',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
async function all(store){let d=await dbp;return new Promise((ok,no)=>{let q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function put(store,val){let d=await dbp;return new Promise((ok,no)=>{let q=d.transaction(store,'readwrite').objectStore(store).put(val);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function del(id){let d=await dbp;return new Promise((ok,no)=>{let q=d.transaction('trades','readwrite').objectStore('trades').delete(id);q.onsuccess=ok;q.onerror=()=>no(q.error)})}
async function load(){trades=await all('trades');let s=await all('settings');capital=Number((s.find(x=>x.key==='capital')||{}).value||0)}
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'), money=n=>(n>=0?'+':'')+'$'+Number(n||0).toFixed(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function calendar(){let sums={};trades.forEach(t=>{let x=sums[t.date]||{p:0,c:0};x.p+=Number(t.pnl||0);x.c++;sums[t.date]=x});let first=new Date(month.getFullYear(),month.getMonth(),1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=key(d),s=sums[k],cl=d.getMonth()!=month.getMonth()?' out':'';if(s)cl+=s.p>0?' green':s.p<0?' red':'';cells+='<button class="day'+cl+'" data-day="'+k+'"><div class="n">'+d.getDate()+'</div>'+(s?'<div class="pnl '+(s.p>=0?'pos':'neg')+'">'+money(s.p)+'</div><div class="cnt">'+s.c+' Trade'+(s.c==1?'':'s')+'</div>':'')+'</button>'}
V.innerHTML='<div class="panel"><div class="row"><button class="btn" id="prev">‹</button><div class="month">'+month.toLocaleDateString('de-DE',{month:'long',year:'numeric'})+'</div><button class="btn" id="next">›</button></div><div class="week"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div><div class="cal">'+cells+'</div></div>';
$('#prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);calendar()};$('#next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);calendar()};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>day(b.dataset.day))}
function day(d){selected=d;let ts=trades.filter(t=>t.date===d).sort((a,b)=>(b.time||'').localeCompare(a.time||''));V.innerHTML='<div class="row"><div><h2>'+new Date(d+'T12:00:00').toLocaleDateString('de-DE')+'</h2><p class="note">'+ts.length+' Trade'+(ts.length==1?'':'s')+'</p></div><button class="btn" id="back">← Kalender</button></div><div class="panel">'+(ts.length?ts.map(t=>'<div class="trade" data-id="'+t.id+'"><div class="row"><b>'+esc(t.symbol)+' · '+esc(t.side)+'</b><strong class="'+(t.pnl>=0?'pos':'neg')+'">'+money(t.pnl)+'</strong></div><div class="meta">'+esc(t.result)+(t.time?' · '+esc(t.time):'')+'</div></div>').join(''):'<p class="note">Noch kein Trade an diesem Tag.</p>')+'</div>';$('#back').onclick=calendar;document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>detail(Number(x.dataset.id)))}
function detail(id){let t=trades.find(x=>x.id===id);if(!t)return calendar();V.innerHTML='<div class="row"><h2>'+esc(t.symbol)+' · '+esc(t.side)+'</h2><button class="btn" id="bd">← Tag</button></div><div class="panel"><div class="row"><span>Ergebnis</span><b>'+esc(t.result)+'</b></div><hr><div class="row"><span>PnL</span><b class="'+(t.pnl>=0?'pos':'neg')+'">'+money(t.pnl)+'</b></div><hr><div class="row"><span>Entry</span><b>'+esc(t.entry||'—')+'</b></div><div class="row"><span>SL</span><b>'+esc(t.sl||'—')+'</b></div><div class="row"><span>TP</span><b>'+esc(t.tp||'—')+'</b></div><p style="white-space:pre-wrap">'+esc(t.notes||'')+'</p>'+(t.image?'<img class="shot" src="'+t.image+'">':'')+'<div class="row" style="margin-top:14px"><button class="btn" id="edit">Bearbeiten</button><button class="btn danger" id="delete">Löschen</button></div></div>';$('#bd').onclick=()=>day(t.date);$('#edit').onclick=()=>form(t);$('#delete').onclick=async()=>{if(confirm('Trade wirklich löschen?')){await del(t.id);await load();day(t.date)}}}
function form(t){t=t||{date:selected||key(new Date()),side:'Long',result:'Win',pnl:0};V.innerHTML='<div class="row"><h2>'+(t.id?'Trade bearbeiten':'Trade hinzufügen')+'</h2><button class="btn" id="cancel">Abbrechen</button></div><form class="panel" id="f"><div class="grid"><div><label>Datum</label><input id="date" type="date" required value="'+esc(t.date)+'"></div><div><label>Uhrzeit</label><input id="time" type="time" value="'+esc(t.time||'')+'"></div><div><label>Markt / Symbol</label><input id="symbol" required value="'+esc(t.symbol||'')+'" placeholder="XAUUSD"></div><div><label>Long / Short</label><select id="side"><option'+(t.side==='Long'?' selected':'')+'>Long</option><option'+(t.side==='Short'?' selected':'')+'>Short</option></select></div><div><label>Entry</label><input id="entry" inputmode="decimal" value="'+esc(t.entry||'')+'"></div><div><label>SL</label><input id="sl" inputmode="decimal" value="'+esc(t.sl||'')+'"></div><div><label>TP</label><input id="tp" inputmode="decimal" value="'+esc(t.tp||'')+'"></div><div><label>Ergebnis</label><select id="result"><option'+(t.result==='Win'?' selected':'')+'>Win</option><option'+(t.result==='Loss'?' selected':'')+'>Loss</option><option'+(t.result==='Break-even'?' selected':'')+'>Break-even</option></select></div><div class="full"><label>Tatsächlicher PnL ($)</label><input id="pnl" inputmode="decimal" required value="'+esc(t.pnl||0)+'"></div><div class="full"><label>Notizen</label><textarea id="notes">'+esc(t.notes||'')+'</textarea></div><div class="full"><label>Chart-Screenshot</label><input id="image" type="file" accept="image/*"></div></div><button class="btn primary" style="margin-top:14px;width:100%">Speichern</button></form>';$('#cancel').onclick=()=>t.id?detail(t.id):calendar();$('#f').onsubmit=async e=>{e.preventDefault();let img=t.image||'';let f=$('#image').files[0];if(f)img=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});let o={id:t.id,date:$('#date').value,time:$('#time').value,symbol:$('#symbol').value.trim().toUpperCase(),side:$('#side').value,entry:$('#entry').value,sl:$('#sl').value,tp:$('#tp').value,result:$('#result').value,pnl:Number($('#pnl').value.replace(',','.')),notes:$('#notes').value,image:img};if(!o.id)delete o.id;let id=await put('trades',o);await load();detail(Number(id))}}
function statistics(){let total=trades.reduce((s,t)=>s+Number(t.pnl||0),0),wins=trades.filter(t=>t.result==='Win').length,loss=trades.filter(t=>t.result==='Loss').length,be=trades.filter(t=>t.result==='Break-even').length,wr=(wins+loss)?wins/(wins+loss)*100:0,roi=capital?total/capital*100:0,balance=capital+total;let m=[['Kontostand','$'+balance.toFixed(2)],['Gesamt-PnL',money(total)],['ROI',roi.toFixed(2)+' %'],['Trades',trades.length],['Wins',wins],['Losses',loss],['Break-even',be],['Winrate',wr.toFixed(1)+' %']];V.innerHTML='<h2>Statistik</h2><div class="stats">'+m.map(x=>'<div class="metric"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel" style="margin-top:14px"><label>Startkapital ($)</label><div class="row"><input id="cap" style="flex:1" inputmode="decimal" value="'+(capital||'')+'" placeholder="z. B. 350"><button id="savecap" class="btn primary">Speichern</button></div></div><div class="panel"><h3>Datensicherung</h3><p class="note">Backup enthält alle Trades inklusive Screenshots.</p><div class="row"><button id="backup" class="btn">Backup exportieren</button><button id="restore" class="btn">Backup importieren</button></div></div>';$('#savecap').onclick=async()=>{capital=Number($('#cap').value.replace(',','.'))||0;await put('settings',{key:'capital',value:capital});statistics()};$('#backup').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,capital,trades},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TradingJournal_Backup_'+key(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#restore').onclick=()=>$('#restoreFile').click()}
$('#restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.trades))throw 0;let d=await dbp;await new Promise((ok,no)=>{let tx=d.transaction(['trades','settings'],'readwrite');tx.objectStore('trades').clear();tx.objectStore('settings').clear();tx.oncomplete=ok;tx.onerror=no});for(let t of x.trades){let c={...t};delete c.id;await put('trades',c)}capital=Number(x.capital||0);await put('settings',{key:'capital',value:capital});await load();statistics();alert('Backup importiert.')}catch{alert('Ungültiges Backup.')}e.target.value=''}
$('#home').onclick=calendar;$('#stats').onclick=statistics;$('#add').onclick=()=>form(null);
(async()=>{await load();calendar();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})})();
</script></body></html>
